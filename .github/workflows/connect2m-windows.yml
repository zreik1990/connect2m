# connect2m Windows build.
# Copyright © 2026 Abdallah Zreik. Derived from RustDesk's flutter-build.yml (AGPL-3.0).
#
# Produces:
#   connect2m-Setup-<version>.exe     Technician app, NSIS installer (also as connect2m-Setup.exe)
#   connect2m-Client-<version>.msi    Client app, MSI for silent deployment (also as connect2m-Client.msi)
#   connect2m-<version>-x86_64.exe    Technician app, portable
#   connect2m-server-windows.zip      Server: ID/relay, sign-in + client list API, download page
#
# Run it from the Actions tab ("Run workflow"). Enter your server's address and
# key (printed by Install-Connect2mServer.ps1) so both apps use only that server.
# The client password comes from the repository secret CONNECT2M_CLIENT_PASSWORD
# (Settings > Secrets and variables > Actions); without it, the default applies.
name: Build connect2m for Windows

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server address (LAN IP or DNS name) the apps connect to"
        type: string
        default: "connect2m-server"
      key:
        description: "Server key (from connect2m-server-info.txt); empty = not checked"
        type: string
        default: ""
      api:
        description: "Sign-in address; empty = http://<server>:21114 (use https://<domain> for Microsoft/Google sign-in)"
        type: string
        default: ""
      publish-release:
        description: "Publish a GitHub Release (tag v<VERSION>) with the files"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: "connect2m"
  APP_MANUFACTURER: "Abdallah Zreik"
  VERSION: "1.5.1"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Server components (see server/windows/README.md)
  SERVER_REPO: "lejianwen/rustdesk-server"
  SERVER_COMMIT: "fb8b5b9cf494d045f0feb370d83913b1a7506388"
  API_REPO: "lejianwen/rustdesk-api"
  API_TAG: "v2.7"
  C2M_SERVER: ${{ inputs.server || 'connect2m-server' }}
  C2M_KEY: ${{ inputs.key || '' }}
  C2M_API: ${{ inputs.api || '' }}

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution only.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

      # Catches Dart mistakes in minutes instead of after the long Windows build.
      - name: Check connect2m Dart code
        working-directory: flutter
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/consts.dart \
            lib/desktop/widgets/connect2m_home_parts.dart \
            lib/desktop/pages/desktop_home_page.dart \
            lib/desktop/pages/desktop_setting_page.dart \
            lib/desktop/pages/connection_page.dart \
            lib/desktop/widgets/remote_toolbar.dart \
            lib/common/widgets/peer_card.dart

  build-topmost-window:
    # Helper DLL used by privacy mode (blank the remote screen).
    runs-on: windows-2022
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build WindowInjection
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: ./RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll

  build-server-tools:
    # ID server (hbbs) and relay (hbbr) for the Windows server bundle.
    runs-on: windows-2022
    steps:
      - name: Checkout server source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ env.SERVER_COMMIT }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: server-windows-2022

      - name: Build hbbs and hbbr
        run: cargo build --release --bin hbbs --bin hbbr

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-tools-x64
          path: |
            target/release/hbbs.exe
            target/release/hbbr.exe
            LICENSE

  build-windows:
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Point About page and terms at this repository's source
        shell: bash
        run: |
          url="${{ github.server_url }}/${{ github.repository }}"
          sed -i "s#__CONNECT2M_SOURCE_URL__#${url}#g" flutter/lib/consts.dart res/msi/Package/License.rtf res/nsis/connect2m.nsi res/nsis/license.txt
          grep -n "kConnect2mSourceUrl =" flutter/lib/consts.dart

      - name: Set the client password
        shell: bash
        env:
          C2M_PASSWORD: ${{ secrets.CONNECT2M_CLIENT_PASSWORD }}
        run: |
          if [ -n "$C2M_PASSWORD" ]; then
            storage=$(python3 -c "import hashlib,base64,os; print('00'+base64.b64encode(hashlib.sha256((os.environ['C2M_PASSWORD']+'connect2m-client').encode()).digest()).decode())")
            echo "::add-mask::$storage"
            echo "CONNECT2M_CLIENT_PASSWORD_STORAGE=$storage" >> "$GITHUB_ENV"
            echo "Client password: from the CONNECT2M_CLIENT_PASSWORD secret."
          else
            echo "Client password: built-in default."
          fi

      - name: Build connect2m
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./dist

          # Virtual display driver
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./dist

          # Remote printer driver (optional, checksum verified)
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./dist/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./dist/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./dist
            } else {
                Write-Output "Printer driver checksums do not match, skipping."
            }
          } catch {
              Write-Host "Ignoring printer driver error."
          }

          # The app installs itself as <app name>.exe; ship it under that name too.
          mv ./dist/rustdesk.exe ./dist/${{ env.APP_NAME }}.exe

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download topmost window helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./dist"

      - name: Write edition settings (technician and client)
        shell: bash
        run: |
          write_ini() {
            {
              echo "[connect2m]"
              echo "edition=$2"
              echo "server=$C2M_SERVER"
              echo "key=$C2M_KEY"
              if [ -n "$C2M_API" ]; then echo "api=$C2M_API"; fi
            } > "$1/connect2m.ini"
          }
          cp -r dist dist-client
          write_ini dist technician
          write_ini dist-client client
          echo "--- technician"; cat dist/connect2m.ini
          echo "--- client"; cat dist-client/connect2m.ini

      - name: Upload unpacked app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connect2m-windows-x64-unpacked
          path: dist

      - name: Build single-file executable (technician, portable)
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../dist/ -o . -e ../../dist/${{ env.APP_NAME }}.exe
          popd
          mkdir -p ./Output
          mv ./target/release/rustdesk-portable-packer.exe ./Output/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.exe

      - name: Build NSIS installer (technician)
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          & $makensis /V3 /WX "/DAPP_VERSION=${{ env.VERSION }}" "/DDIST_DIR=..\..\dist" "/DOUT_FILE=..\..\Output\${{ env.APP_NAME }}-Setup-${{ env.VERSION }}.exe" res\nsis\connect2m.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x86

      - name: Build MSI (client)
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../dist-client --app-name "${{ env.APP_NAME }}" -m "${{ env.APP_MANUFACTURER }}"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../Output/${{ env.APP_NAME }}-Client-${{ env.VERSION }}.msi
          popd

      - name: Stable download names
        shell: bash
        run: |
          cp Output/${{ env.APP_NAME }}-Setup-${{ env.VERSION }}.exe Output/${{ env.APP_NAME }}-Setup.exe
          cp Output/${{ env.APP_NAME }}-Client-${{ env.VERSION }}.msi Output/${{ env.APP_NAME }}-Client.msi
          sha256sum Output/*

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connect2m-windows-x64
          path: ./Output/*

  package-server-and-publish:
    needs: [build-windows, build-server-tools]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: connect2m-windows-x64
          path: ./Output

      - name: Download server tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-tools-x64
          path: ./server-tools

      - name: Assemble server bundle
        run: |
          set -e
          B=bundle/connect2m-server
          mkdir -p $B/bin $B/api $B/www $B/licenses
          cp server/windows/*.ps1 server/windows/README.md $B/
          sed -i "s#__CONNECT2M_REPOSITORY__#${{ github.repository }}#g" $B/Update-Connect2mDownloads.ps1
          cp server/windows/www/* $B/www/
          cp Output/${{ env.APP_NAME }}-Setup.exe Output/${{ env.APP_NAME }}-Client.msi $B/www/
          find server-tools -name 'hbbs.exe' -exec cp {} $B/bin/ \;
          find server-tools -name 'hbbr.exe' -exec cp {} $B/bin/ \;
          cp server-tools/LICENSE $B/licenses/rustdesk-server-AGPL-3.0.txt

          gh release download "${{ env.API_TAG }}" -R "${{ env.API_REPO }}" -p 'windows-amd64.zip' -D dl
          unzip -q dl/windows-amd64.zip -d dl/api
          cp -r dl/api/release/. $B/api/
          curl -fsSL "https://raw.githubusercontent.com/${{ env.API_REPO }}/${{ env.API_TAG }}/LICENSE" -o $B/licenses/rustdesk-api-MIT.txt

          gh release download -R caddyserver/caddy -p 'caddy_*_windows_amd64.zip' -D dl
          unzip -q dl/caddy_*_windows_amd64.zip -d dl/caddy
          cp dl/caddy/caddy.exe $B/bin/
          cp dl/caddy/LICENSE $B/licenses/caddy-Apache-2.0.txt
          cp LICENCE $B/licenses/connect2m-AGPL-3.0.txt

          test -f $B/bin/hbbs.exe && test -f $B/bin/hbbr.exe && test -f $B/api/apimain.exe && test -f $B/bin/caddy.exe
          (cd bundle && zip -qr ../Output/connect2m-server-windows.zip connect2m-server)
          ls -la Output

      - name: Upload server bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connect2m-server-windows
          path: ./Output/connect2m-server-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish-release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          name: connect2m ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          body: |
            connect2m remote support for Windows (64-bit, Windows 10 or newer). Built for server: `${{ env.C2M_SERVER }}`.

            **Which file do I need?**
            - `connect2m-Setup.exe`: **Technician** app installer (same as `connect2m-Setup-${{ env.VERSION }}.exe`).
            - `connect2m-Client.msi`: **Client** app for the PCs you support; deploy silently with `msiexec /i connect2m-Client.msi /qn`.
            - `connect2m-${{ env.VERSION }}-x86_64.exe`: Technician app, portable (no install).
            - `connect2m-server-windows.zip`: the server (ID, relay, sign-in, shared client list, download page). See README.md inside.

            The files are not code-signed yet, so Windows SmartScreen may show "Windows protected your PC". Click **More info → Run anyway**.

            connect2m Copyright © 2026 Abdallah Zreik. Licensed under the GNU AGPL-3.0; based on RustDesk. Source code: this repository.
          files: |
            ./Output/*.exe
            ./Output/*.msi
            ./Output/*.zip
